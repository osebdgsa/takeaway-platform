# Development overrides — opt-in only. The default `docker compose up` stays
# production-like (baked images, no reload).
#
#   make dev          # backend reload + Dockerised Vite dev server (HMR)
#   make dev-down     # stop it
#
# Nginx is intentionally not started in this mode: Vite serves the UI on :5173
# with hot module replacement, and proxies /api to the API container.
#
# Usage without make:
#   docker compose -f docker-compose.yml -f compose.dev.yml up --build db api frontend

services:
  api:
    # Mount only the application package; the rest of the image (entrypoint,
    # Alembic config, scripts) stays as built. Reload watches /app/app.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --reload
      - --reload-dir
      - /app/app
    volumes:
      - ./app:/app/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      # Vite proxies /api here instead of the host's :8080.
      VITE_API_TARGET: http://api:8000
      # Docker Desktop bind mounts do not always deliver inotify events; polling
      # makes HMR reliable at the cost of a little CPU (dev only).
      VITE_USE_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      # Keep container-installed node_modules out of the host checkout.
      - frontend_node_modules:/app/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  frontend_node_modules:
