# Long-lived security header set. Nginx drops all inherited add_header
# directives from a location that declares its own, so every location includes
# this file rather than relying on server-level inheritance.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
# Modern browsers ignore HSTS on plain HTTP; it takes effect once TLS is
# terminated in front of Nginx.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Minimal policy for the SPA: React needs 'unsafe-inline' styles; Vite bundles
# everything else, so scripts/connect/img are same-origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
