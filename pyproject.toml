[project]
name = "takeaway-platform"
version = "1.0.0"
description = "Takeaway platform API: FastAPI, PostgreSQL, SQLAlchemy, JWT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "SQLAlchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "PyJWT==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.8.4",
]

# This is an application, not an installable library: sync dependencies only,
# never build/install the project itself.
[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `uv run pytest` does not put the project root on sys.path the way
# `python -m pytest` does; tests import `app` and `tests.conftest`.
pythonpath = ["."]
